# One-use importer for the user-authorized, reviewed 2026-11-28 score release.
# The payload is fixed data; only the development branch below may be changed.
# Remove this workflow in the GitHub UI after a successful run, before merging.
name: Import reviewed Guoyue score release once

on:
  push:
    branches: ['guoyue/release-20261128']
    paths: ['.github/workflows/guoyue-bootstrap.yml']

permissions: {}

concurrency:
  group: guoyue-reviewed-import-20261128
  cancel-in-progress: false

jobs:
  import-reviewed-release:
    if: github.repository == 'Taitai2025/taitai2025.github.io' && github.ref == 'refs/heads/guoyue/release-20261128' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Verify the fixed patch, apply it and run offline checks
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, io, os, re, shutil, subprocess, tempfile
          from pathlib import Path

          BASE = "2ce860fffdd22e798df406b95ca807b0b334f2d0"
          EXPECTED_TREE = "27cc183b734dea90b235bd7b9c23c3ea7f8600f3"
          FLOW = ".github/workflows/guoyue-bootstrap.yml"
          CHECK = ".github/workflows/score-validation.yml"
          ALLOWED = set("README.md|about/index.html|index.html|notes/index.html|package.json|research/index.html|robots.txt|scores/MAINTENANCE.md|scores/about/index.html|scores/arrangements/index.html|scores/collection-index.json|scores/data.json|scores/data/sources.json|scores/experience.css|scores/experience.js|scores/filters.js|scores/guides/guide.css|scores/guides/index.html|scores/guides/permissions/index.html|scores/guides/rehearsal/index.html|scores/guides/repertoire/index.html|scores/index.html|scores/instruments/index.html|scores/library/index.html|scores/mark.svg|scores/open/bingzhongyin-liu-tianhua-early/index.html|scores/open/blue-danube/index.html|scores/open/canon-and-gigue/index.html|scores/open/carmen-suite-1/index.html|scores/open/flight-of-the-bumblebee/index.html|scores/open/gaijincao-liu-tianhua-early/index.html|scores/open/gao-shan-shenqi/index.html|scores/open/gewuyin-liu-tianhua-early/index.html|scores/open/guang-ling-san-shenqi/index.html|scores/open/hungarian-dances-5-6/index.html|scores/open/index.html|scores/open/liangxiao-liu-tianhua-early/index.html|scores/open/light-cavalry-overture/index.html|scores/open/liu-shui-shenqi/index.html|scores/open/mei-hua-san-nong-shenqi/index.html|scores/open/mozart-turkish-march/index.html|scores/open/nutcracker-suite/index.html|scores/open/offenbach-galop-infernal/index.html|scores/open/peer-gynt-suite-1/index.html|scores/open/ping-sha-luo-yan-li-1920/index.html|scores/open/ping-sha-luo-yan-qinxue/index.html|scores/open/radetzky-march-weninger-historic/index.html|scores/open/shi-mian-mai-fu-hua/index.html|scores/open/shiliuban-xiansuo-beikao/index.html|scores/open/slavonic-dance-op46-no8/index.html|scores/open/thunder-and-lightning-polka/index.html|scores/open/vivaldi-autumn/index.html|scores/open/vivaldi-spring/index.html|scores/open/vivaldi-summer/index.html|scores/open/vivaldi-winter/index.html|scores/open/william-tell-overture/index.html|scores/open/xianjuyin-liu-tianhua-early/index.html|scores/open/yang-guan-san-die-1920/index.html|scores/open/yang-guan-san-die-qinxue/index.html|scores/open/yu-qiao-wen-da-qinxue/index.html|scores/open/yueye-liu-tianhua-early/index.html|scores/open/yulunpao-bawangxiejia-sanxian/index.html|scores/planner/index.html|scores/search/index.html|scores/sitemap.xml|scores/sources/index.html|scores/tools/arrange/app.mjs|scores/tools/arrange/arrange.css|scores/tools/arrange/index.html|scores/tools/arrange/musicxml.mjs|scores/tools/arrange/project.mjs|scores/tools/arrange/score-clock.mjs|scores/tools/arrange/score-file.mjs|scores/tools/arrange/section-compare.mjs|scores/tools/arrange/section-planner.mjs|scores/tools/arrange/sections/app.mjs|scores/tools/arrange/sections/index.html|scores/tools/arrange/sections/sections.css|scores/tools/arrange/sections/setup.mjs|scores/tools/arrange/sections/view.mjs|scores/tools/arrange/turn-windows.mjs|scores/tools/cooperation/index.html|scores/tools/drafts.js|scores/tools/index.html|scores/tools/rehearsal/index.html|scores/work/caoyuan-kuangxiang/index.html|scores/work/dongbei-ensemble/index.html|scores/work/dongbei-mixed/index.html|scores/work/dongbei-orchestra/index.html|scores/work/ganjiang-moye/index.html|scores/work/ganjie/index.html|scores/work/guofeng/index.html|scores/work/haohange/index.html|scores/work/huahaoyueyuan/index.html|scores/work/la-la-land/index.html|scores/work/molihua/index.html|scores/work/qin-bingmayong/index.html|scores/work/ruoxuelinzhi/index.html|scores/work/siji-zuqu/index.html|scores/work/taiyang-song/index.html|scores/work/wusheng-zuqu/index.html|scores/work/yongheng-de-dongfeng/index.html|scripts/build-score-site.py|scripts/check-score-discovery.py|scripts/prepare-score-release.py|scripts/score_experience.py|scripts/test-arrange-comparison.mjs|scripts/test-arrange-project.mjs|scripts/test-catalogue.py|scripts/test-experience.mjs|scripts/test-score-turn-scope.mjs|scripts/verify-score-site.py|sitemap.xml".split("|"))

          def need(condition, message):
              if not condition:
                  raise SystemExit(message)

          def git(*args, env=None):
              return subprocess.check_output(["git", *args], env=env).decode().strip()

          def names(*args):
              return set(filter(None, subprocess.check_output(["git", *args, "-z"]).decode().split("\0")))

          need(os.environ.get("GITHUB_REPOSITORY", "").lower() == "taitai2025/taitai2025.github.io", "Wrong repository")
          need(os.environ.get("GITHUB_REF") == "refs/heads/guoyue/release-20261128", "Wrong branch")
          need(os.environ.get("GITHUB_EVENT_NAME") == "push", "Wrong event")
          head = git("rev-parse", "HEAD")
          need(head == os.environ.get("GITHUB_SHA"), "Checkout is not the triggering commit")
          need(not git("status", "--porcelain"), "Checkout must be clean")
          subprocess.run(["git", "merge-base", "--is-ancestor", BASE, head], check=True)
          need(names("diff", "--name-only", BASE, head) == {FLOW, CHECK}, "Baseline changed beyond the two reviewed workflow files")
          for line in git("rev-list", "--parents", BASE + ".." + head).splitlines():
              parts = line.split()
              need(len(parts) == 2, "Importer requires a linear branch from the fixed baseline")
              need(names("diff", "--name-only", parts[1], parts[0]) <= {FLOW, CHECK}, "Earlier branch commit changes other files")
          need(hashlib.sha256(Path(CHECK).read_bytes()).hexdigest() == "324c5622baa3c439024377354605a8c3188cb12a496bc07ed12c5c808b568676", "Validation workflow differs from the reviewed file")

          lines = Path(FLOW).read_text(encoding="utf-8").splitlines()
          start, end = "# GUOYUE_GZIP_BASE64_BEGIN", "# GUOYUE_GZIP_BASE64_END"
          need(lines.count(start) == lines.count(end) == 1, "Payload markers are missing or duplicated")
          payload_lines = lines[lines.index(start) + 1:lines.index(end)]
          need(bool(payload_lines) and all(re.fullmatch(r"# [A-Za-z0-9+/=]+", line) for line in payload_lines), "Invalid payload comment")
          encoded = "".join(line[2:] for line in payload_lines)
          need(len(encoded) == 482788, "Encoded payload length differs")
          compressed = base64.b64decode(encoded, validate=True)
          need(len(compressed) == 362091, "Compressed payload length differs")
          need(hashlib.sha256(compressed).hexdigest() == "8900aed086e921365c4e8774dc4ea4fba08b5e63b8ceabedfdf76c7c9bfd14e0", "Compressed payload SHA-256 differs")
          with gzip.GzipFile(fileobj=io.BytesIO(compressed)) as stream:
              patch = stream.read(3028434 + 1)
          need(len(patch) == 3028434, "Patch exceeds the fixed decompressed length")
          need(hashlib.sha256(patch).hexdigest() == "819fe1add7e1528dd8713190d8f964f89f0e81c787afc56b23d4c7ad92089edc", "Patch SHA-256 differs")
          headers = re.findall(rb"^diff --git a/([^\n]+) b/([^\n]+)$", patch, re.M)
          need(len(headers) == len(ALLOWED) == 113, "Unexpected patch file count")
          need(all(a == b for a, b in headers), "Renames are not allowed")
          need({a.decode() for a, _ in headers} == ALLOWED, "Patch path allowlist differs")
          need(all(not p.startswith(".github/") and not p.startswith("/") and ".." not in Path(p).parts for p in ALLOWED), "Unsafe patch path")
          need(not re.search(rb"^(deleted file mode|old mode|new mode|rename from|rename to|copy from|copy to) ", patch, re.M), "Deletions, mode changes and copies are not allowed")

          def verify_tree():
              need(not git("diff", "--name-only"), "Working files differ from the reviewed index")
              need(not git("ls-files", "--others", "--exclude-standard"), "Unexpected untracked file")
              need(not git("diff", "--cached", "--name-only", "HEAD", "--", ".github"), "Importer must not modify workflows")
              need(names("diff", "--cached", "--name-only", "HEAD") == ALLOWED, "Staged paths differ from the fixed allowlist")
              total = 0
              for name in ALLOWED:
                  path = Path(name)
                  need(path.is_file() and not path.is_symlink(), "Payload path is not a regular file: " + name)
                  size = path.stat().st_size
                  need(size <= 300000, "Payload file is too large: " + name)
                  total += size
                  need(git("ls-files", "--stage", "--", name).startswith("100644 "), "Unexpected file mode: " + name)
              need(total == 2520612, "Total payload file length differs")
              with tempfile.TemporaryDirectory(prefix="guoyue-index-", dir=os.environ["RUNNER_TEMP"]) as folder:
                  index = Path(folder) / "index"
                  shutil.copyfile(git("rev-parse", "--git-path", "index"), index)
                  env = dict(os.environ, GIT_INDEX_FILE=str(index))
                  subprocess.run(["git", "update-index", "--force-remove", "--", FLOW], env=env, check=True)
                  need(git("write-tree", env=env) == EXPECTED_TREE, "Resulting repository tree differs from the reviewed release")

          with tempfile.TemporaryDirectory(prefix="guoyue-patch-", dir=os.environ["RUNNER_TEMP"]) as folder:
              path = Path(folder) / "reviewed.patch"
              path.write_bytes(patch)
              subprocess.run(["git", "apply", "--check", "--index", str(path)], check=True)
              subprocess.run(["git", "apply", "--index", str(path)], check=True)
          verify_tree()
          print("Verified 113 import paths, patch SHA-256 819fe1add7e1528dd8713190d8f964f89f0e81c787afc56b23d4c7ad92089edc and release tree " + EXPECTED_TREE, flush=True)
          subprocess.run(["npm", "run", "check:scores"], check=True)
          subprocess.run(["npm", "run", "build:scores"], check=True)
          for path in sorted(Path("scores").rglob("*")):
              if path.suffix in {".js", ".mjs"}:
                  subprocess.run(["node", "--check", str(path)], check=True)
          verify_tree()
          print("Offline checks and deterministic rebuild passed; ready for the restricted branch commit.", flush=True)
          PY
      - name: Commit only the reviewed files to the development branch
        shell: bash
        run: |
          python3 - <<'PY'
          import os, shutil, subprocess, tempfile
          from pathlib import Path

          TARGET = "refs/heads/guoyue/release-20261128"
          FLOW = ".github/workflows/guoyue-bootstrap.yml"
          EXPECTED_TREE = "27cc183b734dea90b235bd7b9c23c3ea7f8600f3"

          def git(*args, env=None):
              return subprocess.check_output(["git", *args], env=env).decode().strip()

          def need(condition, message):
              if not condition:
                  raise SystemExit(message)

          need(os.environ.get("GITHUB_REPOSITORY", "").lower() == "taitai2025/taitai2025.github.io", "Wrong repository")
          need(os.environ.get("GITHUB_REF") == TARGET, "Wrong branch")
          need(git("rev-parse", "HEAD") == os.environ["GITHUB_SHA"], "Head changed during validation")
          need(not git("diff", "--name-only"), "Working tree changed after validation")
          need(not git("ls-files", "--others", "--exclude-standard"), "Unexpected untracked file")
          need(not git("diff", "--cached", "--name-only", "HEAD", "--", ".github"), "Refusing to commit workflow changes")
          with tempfile.TemporaryDirectory(prefix="guoyue-final-index-", dir=os.environ["RUNNER_TEMP"]) as folder:
              index = Path(folder) / "index"
              shutil.copyfile(git("rev-parse", "--git-path", "index"), index)
              env = dict(os.environ, GIT_INDEX_FILE=str(index))
              subprocess.run(["git", "update-index", "--force-remove", "--", FLOW], env=env, check=True)
              need(git("write-tree", env=env) == EXPECTED_TREE, "Final release tree differs")
          subprocess.run(["git", "fetch", "--no-tags", "origin", TARGET], check=True)
          need(git("rev-parse", "FETCH_HEAD") == os.environ["GITHUB_SHA"], "Remote branch advanced; refusing to overwrite")
          subprocess.run(["git", "-c", "user.name=github-actions[bot]", "-c", "user.email=41898282+github-actions[bot]@users.noreply.github.com", "commit", "-m", "Import reviewed Guoyue score site 2026-11-28"], check=True)
          subprocess.run(["git", "push", "origin", "HEAD:" + TARGET], check=True)
          commit = git("rev-parse", "HEAD")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## Reviewed release imported to development branch\n\n")
              output.write("- Branch: `guoyue/release-20261128`\n- Commit: `" + commit + "`\n")
              output.write("- Reviewed tree after removing this importer: `" + EXPECTED_TREE + "`\n")
              output.write("- Offline validation, JavaScript syntax and deterministic rebuild passed.\n")
              output.write("- Deployment is not performed by this workflow.\n\n")
              output.write("Next: delete only `.github/workflows/guoyue-bootstrap.yml` in the GitHub UI, open/review the pull request and merge it in the UI. Then verify Pages and the live URLs.\n")
          PY

