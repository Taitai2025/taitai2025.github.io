name: Pack password-protected score parts

on:
  workflow_dispatch:
    inputs:
      slugs:
        description: 'Comma-separated current work slugs. Leave empty to verify all published works.'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: pack-score-pdf-files
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Taitai2025/taitai2025.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF validation dependency
        run: python -m pip install "PyMuPDF==1.26.6"
      - name: Verify and publish parts to the dedicated asset branch
        env:
          SCORE_ASSET_PUSH_TOKEN: ${{ github.token }}
          SCORE_WORK_SLUGS: ${{ inputs.slugs }}
        run: python scripts/pack-direct-parts.py --slugs "$SCORE_WORK_SLUGS"
