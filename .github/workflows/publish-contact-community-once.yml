  cancel-in-progress: false

jobs:
  import-reviewed-content:
    if: github.repository == 'Taitai2025/taitai2025.github.io' && github.ref == 'refs/heads/guoyue/contact-community-20261129' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the fixed review chain, content hashes and target tree, then push to the same branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile

          REPOSITORY = 'Taitai2025/taitai2025.github.io'
          BRANCH = 'guoyue/contact-community-20261129'
          REF = 'refs/heads/' + BRANCH
          IMPORTER = '.github/workflows/publish-contact-community-once.yml'
          STAGING_ROOT = 'scores/.release-staging-20261129'
          MANIFEST_SHA256 = 'a8a7dce10ec0d7ec119270b48669db41a5e4266f0124e1e5159a1c838bfeee63'
          BEGIN = '# GUOYUE_FIXED_MANIFEST_BEGIN'
          END = '# GUOYUE_FIXED_MANIFEST_END'
          os.environ['PYTHONDONTWRITEBYTECODE'] = '1'


          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          def run(*args, capture=False, env=None, binary=False):
              result = subprocess.run(args, check=True, env=env, text=not binary,
                                      stdout=subprocess.PIPE if capture else None)
              return result.stdout if capture else None


          def git(*args, env=None):
              return run('git', *args, capture=True, env=env).strip()


          def git_bytes(*args, env=None):
              return run('git', *args, capture=True, env=env, binary=True)


          def changed_paths(*args, env=None):
              return set(filter(None, git_bytes('diff', '--no-renames', '--name-only', '-z', *args, env=env).decode().split('\0')))


          def statuses(*args, env=None):
              rows = git_bytes('diff', '--no-renames', '--name-status', '-z', *args, env=env).decode().split('\0')
              require(rows[-1] == '' and (len(rows) - 1) % 2 == 0, 'Malformed path status output.')
              pairs = list(zip(rows[:-1:2], rows[1:-1:2]))
              require(len({name for _, name in pairs}) == len(pairs), 'Duplicate changed path.')
              return {name: status for status, name in pairs}


          def load_manifest():
              content = Path(IMPORTER).read_text(encoding='ascii')
              require(content.count(BEGIN + '\n') == content.count(END + '\n') == 1, 'Manifest block markers are not unique.')
              block = content.split(BEGIN + '\n')[1].split(END + '\n')[0]
              lines = block.splitlines()
              require(lines and all(re.fullmatch(r'# [A-Za-z0-9+/=]{1,100}', line) for line in lines), 'Invalid manifest Base64.')
              raw = base64.b64decode(''.join(line[2:] for line in lines), validate=True)
              require(hashlib.sha256(raw).hexdigest() == MANIFEST_SHA256, 'Fixed manifest digest mismatch.')
              value = json.loads(raw)
              require(value['repository'] == REPOSITORY and value['branch'] == BRANCH and value['importer'] == IMPORTER,
                      'Fixed release destination mismatch.')
              require(value['stagingRoot'] == STAGING_ROOT, 'Unexpected staging directory.')
              require(value['fileCount'] == len(value['sha256']) == len(value['changedFiles']), 'Output count mismatch.')
              require(set(value['changedFiles']) == set(value['sha256']), 'Output allowlist mismatch.')
              require(set(value['binaryFiles']) <= set(value['newFiles']) <= set(value['sha256']), 'Invalid new/binary-file allowlists.')
              return value


          def origin_is_fixed():
              allowed = {'https://github.com/' + REPOSITORY, 'https://github.com/' + REPOSITORY + '.git'}
              require(git('remote', 'get-url', '--all', 'origin') in allowed, 'Unexpected origin URL(s).')
              require(git('remote', 'get-url', '--push', '--all', 'origin') in allowed, 'Unexpected origin push URL(s).')


          def remote_equals(commit):
              origin_is_fixed()
              require(git('ls-remote', '--exit-code', 'origin', REF).split() == [commit, REF],
                      'The review branch moved; stop without overwriting it.')


          def regular_file(name):
              path = Path(name)
              require(path.is_file() and not path.is_symlink(), 'Missing or non-regular file: ' + name)
              require(all(not parent.is_symlink() for parent in path.parents), 'Symlink ancestor: ' + name)
              return path


          def assert_environment(manifest):
              require(os.environ.get('GITHUB_ACTIONS') == 'true', 'GitHub Actions is required.')
              require(os.environ.get('GITHUB_EVENT_NAME') == 'push', 'Only the fixed push event is allowed.')
              require(os.environ.get('GITHUB_REPOSITORY') == REPOSITORY, 'Repository mismatch.')
              require(os.environ.get('GITHUB_REF') == REF, 'Branch mismatch.')
              trigger = os.environ.get('GITHUB_SHA', '')
              require(re.fullmatch(r'[0-9a-f]{40}', trigger), 'Invalid triggering commit.')
              require(git('rev-parse', 'HEAD') == trigger, 'Checkout must equal the triggering commit.')
              require(not git('status', '--porcelain', '--untracked-files=all'), 'Checkout is not clean.')
              base = manifest['base']
              run('git', 'merge-base', '--is-ancestor', base, trigger)
              require(not git('ls-tree', '-r', '--name-only', base, '--', STAGING_ROOT, IMPORTER),
                      'The fixed base must not already contain this release staging area or importer.')
              part_paths = {p['path'] for p in manifest['payload']['parts']}
              require(part_paths and all(re.fullmatch(re.escape(STAGING_ROOT) + r'/part-[0-9]{3,}\.b64', p) for p in part_paths),
                      'Invalid fixed staging path.')
              require(statuses(base, trigger) == {p: 'A' for p in part_paths | {IMPORTER}},
                      'Base-to-trigger changes must only add the fixed parts and importer.')
              previous = base
              added_parts = set()
              history = git('rev-list', '--reverse', '--parents', base + '..' + trigger).splitlines()
              require(history, 'The triggering commit must follow the fixed base.')
              for row in history:
                  commit, *parents = row.split()
                  require(parents == [previous], 'Release staging must be linear, without merges.')
                  delta = statuses(previous, commit)
                  if commit == trigger:
                      require(delta == {IMPORTER: 'A'}, 'The final staging commit must only add this importer.')
                  else:
                      require(delta and set(delta) <= part_paths - added_parts and set(delta.values()) == {'A'},
                              'Staging commits may only add previously absent fixed payload parts.')
                      added_parts.update(delta)
                  previous = commit
              require(previous == trigger and added_parts == part_paths, 'The staged payload is incomplete.')
              for name in part_paths | {IMPORTER}:
                  regular_file(name)
                  require(git('ls-files', '--stage', '--', name).split()[0] == '100644', 'Importer/payload mode must be 100644.')
              remote_equals(trigger)
              return trigger


          def decode_patch(manifest):
              data = manifest['payload']
              parts = data['parts']
              require([p['path'] for p in parts] == [STAGING_ROOT + '/part-' + str(i).zfill(3) + '.b64' for i in range(1, len(parts) + 1)],
                      'Payload parts must be in the fixed contiguous order.')
              chunks = []
              for record in parts:
                  raw = regular_file(record['path']).read_bytes()
                  require(len(raw) == record['bytes'] and hashlib.sha256(raw).hexdigest() == record['sha256'],
                          'Payload part digest/length mismatch: ' + record['path'])
                  require(raw.endswith(b'\n') and all(re.fullmatch(rb'[A-Za-z0-9+/=]{1,100}', line) for line in raw.splitlines()),
                          'Invalid payload Base64 lines.')
                  chunks.append(b''.join(raw.splitlines()))
              encoded = b''.join(chunks)
              require(len(encoded) == data['base64Characters'], 'Encoded payload size mismatch.')
              compressed = base64.b64decode(encoded, validate=True)
              require(len(compressed) == data['gzipBytes'] and hashlib.sha256(compressed).hexdigest() == data['gzipSha256'],
                      'Compressed payload digest/length mismatch.')
              patch = gzip.decompress(compressed)
              require(len(patch) == manifest['patchBytes'] and hashlib.sha256(patch).hexdigest() == manifest['patchSha256'],
                      'Patch digest/length mismatch.')
              return patch


          def temporary_index(directory):
              path = Path(directory) / 'review.index'
              shutil.copyfile(git('rev-parse', '--git-path', 'index'), path)
              env = dict(os.environ, GIT_INDEX_FILE=str(path.resolve()))
              return env


          def content_tree(manifest, env=None):
              # Only a disposable index is modified to omit the temporary importer.
              with tempfile.TemporaryDirectory(prefix='guoyue-tree-') as directory:
                  if env is None:
                      tree_env = temporary_index(directory)
                  else:
                      target = Path(directory) / 'review.index'
                      shutil.copyfile(env['GIT_INDEX_FILE'], target)
                      tree_env = dict(env, GIT_INDEX_FILE=str(target.resolve()))
                  run('git', 'update-index', '--force-remove', '--', IMPORTER, env=tree_env)
                  return git('write-tree', env=tree_env)


          def binary_signature(data, media_type):
              if media_type == 'image/jpeg':
                  return data.startswith(b'\xff\xd8\xff')
              if media_type == 'image/png':
                  return data.startswith(b'\x89PNG\r\n\x1a\n')
              if media_type == 'image/webp':
                  return len(data) >= 12 and data[:4] == b'RIFF' and data[8:12] == b'WEBP'
              if media_type == 'application/pdf':
                  return data.startswith(b'%PDF-')
              return False


          def assert_index(manifest, trigger, env=None):
              hashes = manifest['sha256']
              new = set(manifest['newFiles'])
              part_paths = {p['path'] for p in manifest['payload']['parts']}
              expected_status = {p: ('A' if p in new else 'M') for p in hashes}
              expected_status.update({p: 'D' for p in part_paths})
              require(statuses('--cached', trigger, env=env) == expected_status, 'Staged scope or change types differ from the reviewed release.')
              for name, expected in hashes.items():
                  row = git('ls-files', '--stage', '--', name, env=env).split()
                  require(len(row) == 4 and row[0] == '100644' and row[2] == '0' and row[3] == name,
                          'Only ordinary 100644 files are permitted: ' + name)
                  raw = git_bytes('show', ':' + name, env=env)
                  require(hashlib.sha256(raw).hexdigest() == expected, 'Staged output digest mismatch: ' + name)
                  if name in manifest['binaryFiles']:
                      binary = manifest['binaryFiles'][name]
                      require(len(raw) == binary['bytes'] and binary_signature(raw, binary['mediaType']),
                              'Binary asset bytes or signature mismatch: ' + name)
              require(content_tree(manifest, env) == manifest['expectedTree'],
                      'The complete content-only repository tree differs from the reviewed target.')


          def apply_fixed_patch(manifest, trigger):
              patch = decode_patch(manifest)
              hashes = manifest['sha256']
              for name in hashes:
                  path = Path(name)
                  require(not path.is_symlink() and all(not parent.is_symlink() for parent in path.parents),
                          'An output path has a symbolic-link ancestor: ' + name)
              with tempfile.TemporaryDirectory(prefix='guoyue-fixed-patch-') as directory:
                  patch_path = Path(directory) / 'reviewed.patch'
                  patch_path.write_bytes(patch)
                  seen = set()
                  rows = git_bytes('apply', '--numstat', '-z', str(patch_path)).split(b'\0')
                  for row in filter(None, rows):
                      fields = row.split(b'\t', 2)
                      require(len(fields) == 3, 'Malformed patch path record.')
                      added, removed, raw_name = fields
                      name = raw_name.decode('utf-8', errors='strict')
                      require(name in hashes and name not in seen, 'Patch path is not in the fixed allowlist.')
                      is_binary = added == removed == b'-'
                      require(is_binary or (added.isdigit() and removed.isdigit()), 'Unsupported patch record.')
                      require(is_binary == (name in manifest['binaryFiles']), 'Patch binary classification mismatch: ' + name)
                      seen.add(name)
                  require(seen == set(hashes), 'Patch scope differs from the exact output allowlist.')
                  # Apply to a disposable index first. Verify ALL blobs, modes, statuses,
                  # and the complete target tree before changing a worktree file.
                  env = temporary_index(directory)
                  run('git', 'apply', '--cached', '--check', str(patch_path), env=env)
                  run('git', 'apply', '--cached', str(patch_path), env=env)
                  parts = [p['path'] for p in manifest['payload']['parts']]
                  run('git', 'update-index', '--force-remove', '--', *parts, env=env)
                  assert_index(manifest, trigger, env)
                  run('git', 'apply', '--index', '--check', str(patch_path))
                  run('git', 'apply', '--index', str(patch_path))
                  # Payload parts are plain content, never workflow files. Their removal
                  # is part of this same content commit; the importer stays for the owner.
                  run('git', 'rm', '--', *parts)


          def assert_content(manifest, trigger):
              require(git('rev-parse', 'HEAD') == trigger, 'HEAD changed before validation finished.')
              assert_index(manifest, trigger)
              require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked files.')
              for name, sha in manifest['sha256'].items():
                  require(hashlib.sha256(regular_file(name).read_bytes()).hexdigest() == sha,
                          'Worktree output digest mismatch: ' + name)
              require(all(not Path(p['path']).exists() for p in manifest['payload']['parts']), 'Temporary payload was not removed.')
              run('git', 'diff', '--exit-code')
              run('git', 'diff', '--cached', '--check')
              print('Verified', manifest['fileCount'], 'output hashes and the complete reviewed content tree.')


          def validate_site(manifest, trigger):
              run('npm', 'install', '--ignore-scripts', '--no-audit', '--no-fund', '--package-lock=false')
              for script in ['check:scores', 'check:scores:ui', 'check:scores:community', 'check:scores:orchestras']:
                  run('npm', 'run', script)
              run('npm', 'run', 'build:scores')
              # Rebuilding must reproduce the reviewed bytes/tree without staging new
              # output. This checks determinism against the independently reviewed build.
              assert_content(manifest, trigger)
              for path in sorted(Path('scores').rglob('*')):
                  if path.suffix in {'.js', '.mjs'}:
                      run('node', '--check', str(path))


          def commit_fixed_content(manifest, trigger):
              run('git', 'config', 'user.name', 'github-actions[bot]')
              run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              run('git', '-c', 'core.hooksPath=/dev/null', '-c', 'commit.gpgsign=false', 'commit', '-m',
                  'Improve orchestra submissions, restricted-score contact, support and source updates')
              commit = git('rev-parse', 'HEAD')
              require(git('rev-list', '--parents', '-n', '1', commit).split() == [commit, trigger],
                      'Content commit must directly follow the triggering commit.')
              expected = {p: ('A' if p in manifest['newFiles'] else 'M') for p in manifest['sha256']}
              expected.update({p['path']: 'D' for p in manifest['payload']['parts']})
              require(statuses(trigger, commit) == expected, 'Committed scope differs from the reviewed release.')
              require(content_tree(manifest) == manifest['expectedTree'], 'Committed content-only tree mismatch.')
              require(not git('status', '--porcelain', '--untracked-files=all'), 'Content commit must leave a clean checkout.')
              return commit


          def publish(trigger, commit):
              require(git('rev-parse', 'HEAD') == commit, 'HEAD changed before publication.')
              remote_equals(trigger)
              # Ordinary fast-forward only, to the SAME fixed review branch. Checkout
              # supplies the standard job-scoped GITHUB_TOKEN; never read credentials.
              run('git', 'push', 'origin', 'HEAD:' + REF)
              remote_equals(commit)
              print('Published only to the fixed review branch. The owner must delete this temporary importer in the GitHub UI before opening/merging the PR.')


          def main():
              manifest = load_manifest()
              trigger = assert_environment(manifest)
              apply_fixed_patch(manifest, trigger)
              assert_content(manifest, trigger)
              validate_site(manifest, trigger)
              assert_content(manifest, trigger)
              commit = commit_fixed_content(manifest, trigger)
              publish(trigger, commit)


          if __name__ == '__main__':
              main()
          PY
