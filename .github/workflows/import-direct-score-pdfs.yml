      - name: Publish validated source to the review branch
        env:
          SCORE_ASSET_PUSH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/score-git-askpass" <<'ASKPASS_SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$SCORE_ASSET_PUSH_TOKEN" ;;
          esac
          ASKPASS_SCRIPT
          chmod 700 "$RUNNER_TEMP/score-git-askpass"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- scores/MAINTENANCE.md scores/experience.css scores/part-pdf.js scores/work scripts/build-score-site.py scripts/pack-direct-parts.py scripts/test-part-pdf.mjs
          git diff --cached --check
          git commit -m 'Enable password-protected individual PDF previews'
          GIT_TERMINAL_PROMPT=0 GIT_ASKPASS="$RUNNER_TEMP/score-git-askpass" git push origin HEAD:refs/heads/score-part-previews-20261128
          rm "$RUNNER_TEMP/score-git-askpass"
      - name: Check and publish the already protected score parts
        env:
          SCORE_ASSET_PUSH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install 'PyMuPDF==1.26.6'
          python scripts/pack-direct-parts.py
