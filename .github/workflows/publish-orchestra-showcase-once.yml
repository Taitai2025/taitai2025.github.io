          jrDcdolfHnLMgSaLGrt27A97LOFS1r5L6+InLloO/NPy0d1reenINQXEd+w/PTjgyI6fPH32vDRX4SeczvUouj/3QaxpJQTMW7Ks
          X8rdCLmokdkz7XPeTLoBNk4crj6i81rUQj8J76zLdg70XQuHx8gBnPp7DgON4CcGXqGN5x97AcerEJFh2tx4/IP/ALMw5+UX1C0A
          """


          def require(condition, message):
              if not condition:
                  raise SystemExit(message)


          def run(*args, capture=False):
              result = subprocess.run(args, check=True, text=True,
                                      stdout=subprocess.PIPE if capture else None)
              return result.stdout.strip() if capture else None


          def git(*args):
              return run('git', *args, capture=True)


          def changed_paths(*args):
              return set(filter(None, git('diff', '--name-only', '-z', *args).split('\0')))


          def assert_environment():
              require(os.environ.get('GITHUB_ACTIONS') == 'true', 'GitHub Actions is required.')
              require(os.environ.get('GITHUB_EVENT_NAME') == 'push', 'Only the fixed push event is allowed.')
              require(os.environ.get('GITHUB_REPOSITORY') == REPOSITORY, 'Repository mismatch.')
              require(os.environ.get('GITHUB_REF') == REF, 'Branch mismatch.')
              trigger = os.environ.get('GITHUB_SHA', '')
              require(re.fullmatch(r'[0-9a-f]{40}', trigger), 'Invalid triggering commit.')
              require(git('rev-parse', 'HEAD') == trigger, 'Checkout must equal the triggering commit.')
              require(git('rev-list', '--parents', '-n', '1', trigger).split() == [trigger, BASE],
                      'The triggering commit must have exactly the fixed base as its parent.')
              require(changed_paths(BASE, trigger) == {IMPORTER}, 'Only this importer may differ from the fixed base.')
              require(git('diff', '--name-status', BASE, trigger) == 'A\t' + IMPORTER,
                      'The triggering commit must add only this new importer.')
              require(not git('status', '--porcelain', '--untracked-files=all'), 'Checkout is not clean.')
              require(git('remote', 'get-url', 'origin') == 'https://github.com/' + REPOSITORY,
                      'Unexpected origin URL.')
              require(git('remote', 'get-url', '--push', 'origin') == 'https://github.com/' + REPOSITORY,
                      'Unexpected origin push URL.')
              require(len(FILES) == 90 and len(NEW_FILES) == 10 and NEW_FILES <= FILES.keys(),
                      'Fixed file manifest is invalid.')
              require(IMPORTER not in FILES and all(not name.startswith('.github/') for name in FILES),
                      'The content payload may not change workflows.')
              return trigger


          def apply_fixed_patch():
              patch = gzip.decompress(base64.b64decode(''.join(PAYLOAD.split())))
              require(len(patch) == PATCH_BYTES and hashlib.sha256(patch).hexdigest() == PATCH_SHA256,
                      'Embedded patch digest or length mismatch.')
              with tempfile.TemporaryDirectory(prefix='orchestra-fixed-patch-') as directory:
                  path = Path(directory) / 'showcase.patch'
                  path.write_bytes(patch)
                  rows = git('apply', '--numstat', '-z', str(path)).split('\0')
                  patch_paths = set()
                  for row in filter(None, rows):
                      added, removed, name = row.split('\t', 2)
                      require(added.isdecimal() and removed.isdecimal(), 'Only text-file changes are allowed.')
                      require(name in FILES and name not in patch_paths, 'Patch path is not in the fixed allowlist.')
                      patch_paths.add(name)
                  require(patch_paths == FILES.keys(), 'The patch must change exactly the 90 fixed files.')
                  run('git', 'apply', '--index', '--check', str(path))
                  run('git', 'apply', '--index', str(path))


          def assert_content(trigger):
              require(git('rev-parse', 'HEAD') == trigger, 'HEAD changed before validation completed.')
              require(changed_paths('--cached', trigger) == FILES.keys(), 'Staged changes exceed the fixed allowlist.')
              statuses = git('diff', '--cached', '--name-status', trigger).splitlines()
              for row in statuses:
                  status, name = row.split('\t')
                  require(status == ('A' if name in NEW_FILES else 'M'), 'Unexpected change type.')
              require(not git('ls-files', '--others', '--exclude-standard'), 'Unexpected untracked repository files.')
              for name, expected in FILES.items():
                  path = Path(name)
                  require(path.is_file() and not path.is_symlink(), 'A fixed output file is missing or is a symbolic link.')
                  require(hashlib.sha256(path.read_bytes()).hexdigest() == expected, 'Output digest mismatch: ' + name)
              run('git', 'diff', '--exit-code')
              run('git', 'diff', '--cached', '--check')
              # Check the entire repository tree with the temporary importer omitted.
              # Restore that tracked importer in the index even if tree validation fails.
              try:
                  run('git', 'update-index', '--force-remove', IMPORTER)
                  actual_tree = git('write-tree')
              finally:
                  run('git', 'reset', '-q', trigger, '--', IMPORTER)
              require(actual_tree == EXPECTED_TREE, 'The content-only repository tree does not match the reviewed tree.')
              print('Verified all 90 output hashes and the complete content-only repository tree.')


          def validate_site():
              run('npm', 'run', 'check:scores')
              run('python3', 'scripts/build-orchestra-showcase.py', '--check')
              run('npm', 'install', '--ignore-scripts', '--no-audit', '--no-fund', '--package-lock=false')
              run('node', 'scripts/test-orchestra-showcase.mjs')
              run('npm', 'run', 'build:scores')
              run('git', 'diff', '--exit-code')
              for path in sorted(Path('scores').rglob('*')):
                  if path.suffix in {'.js', '.mjs'}:
                      run('node', '--check', str(path))


          def commit_fixed_content(trigger):
              run('git', 'config', 'user.name', 'github-actions[bot]')
              run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
              run('git', 'commit', '-m', 'Publish university orchestra showcase and NMOU profile')
              commit = git('rev-parse', 'HEAD')
              require(git('rev-list', '--parents', '-n', '1', commit).split() == [commit, trigger],
                      'The content commit must directly follow the triggering commit.')
              require(changed_paths(trigger, commit) == FILES.keys(), 'Committed file scope differs from the reviewed scope.')
              require(not git('status', '--porcelain', '--untracked-files=all'), 'Repository must be clean after the content commit.')
              return commit


          def publish(trigger, commit):
              require(git('rev-parse', 'HEAD') == commit, 'Commit changed before publication.')
              require(git('remote', 'get-url', '--push', 'origin') == 'https://github.com/' + REPOSITORY,
                      'Unexpected origin push URL before publication.')
              remote = git('ls-remote', '--exit-code', 'origin', REF).split()
              require(remote == [trigger, REF], 'The remote branch moved; stop without overwriting it.')
              # Ordinary fast-forward push only. A concurrent update will be rejected.
              # The checkout action manages the job-scoped credential; do not read it.
              run('git', 'push', 'origin', 'HEAD:' + REF)
              print('Published the verified content to the same review branch. Delete this temporary importer in the GitHub UI before merging.')


          def main():
              trigger = assert_environment()
              apply_fixed_patch()
              assert_content(trigger)
              validate_site()
              assert_content(trigger)
              commit = commit_fixed_content(trigger)
              publish(trigger, commit)


          main()
